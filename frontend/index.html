<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logoSV.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      (function () {
        try {
          var dark = localStorage.getItem("theme") !== "light";
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0d0d0d" : "#f9f8f6");
        } catch (e) {}
      })();
    </script>
    <title>Sapeksh Vishwakarma</title>
    <meta name="description" content="Sapeksh Vishwakarma, Software Engineer in Pune and Assistant System Engineer at TCS. Full stack developer with MERN, React Native, REST APIs, CI/CD, Docker and AWS experience; co-developer of GoEventify." />
    <meta property="og:title" content="Sapeksh Vishwakarma" />
    <meta property="og:description" content="Software Engineer in Pune and Assistant System Engineer at TCS. Full stack developer with MERN, React Native, CI/CD, Docker and AWS experience." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sapeksh Vishwakarma " />
    <meta name="twitter:description" content="Software Engineer in Pune and Assistant System Engineer at TCS. Full stack developer with MERN, React Native, CI/CD, Docker and AWS experience." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
